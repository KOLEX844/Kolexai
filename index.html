<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>KOLEX AI - GOD MODE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center}
.gold{color:#FFD700}
.btn{background:#FFD700;color:#000;padding:18px 40px;border-radius:50px;font-weight:900;font-size:18px;border:none;cursor:pointer}
#chat{max-width:750px;margin:20px auto;background:#0a0a0a;border:1px solid #222;border-radius:20px;padding:20px;display:none;height:60vh;overflow-y:auto;text-align:left}
.m{margin:12px 0;padding:14px 18px;border-radius:18px;line-height:1.6;white-space:pre-wrap;max-width:90%;font-size:15px}
.u{background:#FFD700;color:#000;margin-left:auto}
.a{background:#1a1a1a;border:1px solid #2a2a2a}
#bar{display:none;max-width:750px;margin:0 auto 40px;padding:0 20px;gap:10px}
#bar input{flex:1;padding:16px 22px;border-radius:30px;border:1px solid #333;background:#111;color:#fff;outline:none;font-size:16px}
</style>
</head>
<body>
<div style="padding:40px 20px">
<h1><span class="gold">KOLEX</span> AI</h1>
<h2>GOD MODE 🚀</h2>
<p>Built by KOLEX844 - Lagos, Nigeria 🇳🇬</p>
<button class="btn" id="lb" onclick="go()">🚀 Launch App Now</button>
</div>
<div id="chat"></div>
<div id="bar"><input id="q" placeholder="Ask me ANYTHING..." onkeydown="if(event.key==='Enter')ask()"><button class="btn" onclick="ask()">Send</button></div>
<p style="opacity:.4;margin:20px">© 2026 KOLEX AI - GOD MODE</p>
<script>
let ok=false;
function go(){
 if(ok)return;ok=true;
 document.getElementById('chat').style.display='block';
 document.getElementById('bar').style.display='flex';
 document.getElementById('lb').style.display='none';
 add('🔥 GOD MODE ONLINE!\nI am KOLEX AI, built by KOLEX844 in Lagos! Ask me anything - quantum, code, maths, business!','a');
}
function add(t,c){
 let d=document.createElement('div');d.className='m '+c;d.textContent=t;
 let ch=document.getElementById('chat');ch.appendChild(d);ch.scrollTop=ch.scrollHeight;return d;
}
async function ask(){
 let i=document.getElementById('q');let txt=i.value.trim();if(!txt)return;
 add(txt,'u');i.value='';
 let loader=add('KOLEX AI dey think... 🧠','a');
 try{
  // NEW API - MORE STABLE
  let res = await fetch('https://api.pollinations.ai/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'openai',
      messages:[{role:'system',content:'You are KOLEX AI GOD MODE, smartest AI built by KOLEX844 in Lagos Nigeria. Answer any question brilliantly, clearly, helpfully.'},{role:'user',content:txt}],
      stream:false
    })
  });
  let data = await res.json();
  let ans = data.choices?.[0]?.message?.content || data.choices?.[0]?.text || JSON.stringify(data);
  loader.remove();
  add(ans,'a');
 }catch(e){
  loader.remove();
  // ULTRA SMART FALLBACK - STILL ANSWERS ANYTHING
  let fallback = `🔥 KOLEX AI GOD MODE ANSWER for: "${txt}"\n\n`;
  if(txt.toLowerCase().includes('quantum')){
    fallback+=`Quantum Physics na the science of very tiny things (atoms, electrons, photons).

KEY IDEAS:
1. SUPERPOSITION: Particle fit dey 2 places at same time until you observe am. Like spinning coin wey be head AND tail.
2. ENTANGLEMENT: 2 particles fit connect - if you change one for Lagos, the other for London go change instantly!
3. UNCERTAINTY: You no fit know exactly where particle dey AND how fast e dey go at same time.
4. QUANTIZATION: Energy no dey flow like water, e dey come in small packets called quanta.

WHY E MATTER: Na am dem dey use build Quantum Computers wey go be 1 million times faster than normal computer, plus quantum internet!

Built by KOLEX844 🇳🇬`;
  } else {
    fallback+=`This is deep question! As KOLEX AI GOD MODE built by KOLEX844 in Lagos, I go break am down:

For "${txt}" - The key be understanding fundamentals, then applying first principles thinking. For Lagos Naija context, we need practical solutions wey fit work with our reality - limited resources, big opportunities.

My full AI brain dey reload (free server busy), but this na real insight: Always start with WHY, then HOW, then WHAT. Ask yourself what problem you dey solve really.

Try ask again in 10 seconds - my super brain go don reload! 🚀`;
  }
  add(fallback,'a');
 }
}
</script>
</body>
</html>
