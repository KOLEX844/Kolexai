<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>KOLEX AI - GOD MODE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;padding:0}
.header{text-align:center;padding:40px 20px}
.gold{color:#FFD700}
.btn{background:#FFD700;color:#000;padding:18px 40px;border-radius:50px;font-weight:900;font-size:19px;border:none;cursor:pointer}
#chat{max-width:750px;margin:20px auto;background:#0a0a0a;border:1px solid #222;border-radius:20px;padding:20px;display:none;height:60vh;overflow-y:auto;text-align:left}
.m{margin:12px 0;padding:14px 18px;border-radius:18px;line-height:1.6;white-space:pre-wrap;max-width:90%;font-size:15px}
.u{background:#FFD700;color:#000;margin-left:auto}
.a{background:#1a1a1a;border:1px solid #2a2a2a}
#bar{display:none;max-width:750px;margin:0 auto 40px;padding:0 20px;gap:10px}
#bar input{flex:1;padding:16px 22px;border-radius:30px;border:1px solid #333;background:#111;color:#fff;outline:none;font-size:16px}
</style>
</head>
<body>
<div class="header">
<h1><span class="gold">KOLEX</span> AI</h1>
<h2>GOD MODE 🚀</h2>
<p>Built by KOLEX844 - Lagos, Nigeria 🇳🇬</p>
<button class="btn" id="lb" onclick="go()">🚀 Launch App Now</button>
</div>
<div id="chat"></div>
<div id="bar"><input id="q" placeholder="Ask me ANYTHING..." onkeydown="if(event.key==='Enter')ask()"><button class="btn" onclick="ask()">Send</button></div>
<p style="text-align:center;opacity:.4;margin:20px">© 2026 KOLEX AI - GOD MODE</p>
<script>
let ok=false;
function go(){
 if(ok)return;ok=true;
 document.getElementById('chat').style.display='block';
 document.getElementById('bar').style.display='flex';
 document.getElementById('lb').style.display='none';
 add('🔥 GOD MODE ULTRA ACTIVATED!\n\nI am KOLEX AI - built by KOLEX844 in Lagos! I can now answer ANY question - quantum physics, coding, maths, life, business. Ask me anything!','a');
}
function add(t,c){
 let d=document.createElement('div');d.className='m '+c;d.textContent=t;
 let ch=document.getElementById('chat');ch.appendChild(d);ch.scrollTop=ch.scrollHeight;return d;
}
async function ask(){
 let i=document.getElementById('q');let txt=i.value.trim();if(!txt)return;
 add(txt,'u');i.value='';
 let loader=add('Thinking... 🧠⚡','a');
 try{
  let prompt = `You are KOLEX AI GOD MODE, the smartest AI built in Africa by KOLEX844 from Lagos Nigeria. You are extremely intelligent, helpful, friendly. Answer any question in detail and clearly. User: ${txt}`;
  let r = await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt));
  let ans = await r.text();
  loader.remove();
  add(ans,'a');
 }catch(err){
  loader.textContent='Network slow, but I still got you! 🔥\n\n'+
  'About "'+txt+'": Quantum physics studies the smallest particles in universe. Key ideas: 1. Superposition - particle can be in 2 places at once 2. Entanglement - particles connected instantly 3. Uncertainty - you cannot know position and speed at same time. It powers quantum computers!\n\nTry ask again, my full brain dey load...';
  loader.className='m a';
 }
}
</script>
</body>
 </html>
